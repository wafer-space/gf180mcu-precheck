name: Build and Publish Docker Container

on:
  push:
    branches:
      - main
    tags:
      - "[1-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git-describe

      - name: Generate version from git-describe
        id: version
        run: |
          VERSION=$(git describe --tags --always --dirty)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      # Resolve the pinned PDK_COMMIT to a PDK version number so it can be
      # published as an image label. platform.wafer.space reads the
      # gf180mcu-precheck.pdk_version label to display version info for
      # checks. Unresolvable values are fatal and fail the build.
      - name: Resolve PDK version from Makefile
        id: pdk
        run: python3 scripts/resolve_pdk_version.py | tee -a "$GITHUB_OUTPUT"

      - name: Generate SHA tag prefix
        id: sha_prefix
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            printf -v PREFIX "pr%04d" "${{ github.event.pull_request.number }}"
          elif [[ "${{ github.ref }}" == refs/heads/* ]]; then
            PREFIX="${{ github.ref_name }}"
          else
            PREFIX=""
          fi
          echo "value=$PREFIX" >> $GITHUB_OUTPUT
          echo "Generated SHA tag prefix: $PREFIX"

      # Check if token can write to GitHub Actions cache (needed for cache-to)
      - name: Check token permissions for GHA cache
        id: gha_cache_permissions
        run: |
          CAN_WRITE=$(gh api repos/${{ github.repository }} --jq '.permissions.push // false')
          echo "can_write=$CAN_WRITE" >> $GITHUB_OUTPUT
          echo "Token has GHA cache write permission: $CAN_WRITE"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=${{ steps.sha_prefix.outputs.value }}-,enable=${{ steps.sha_prefix.outputs.value != '' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            gf180mcu-precheck.pdk_version=${{ steps.pdk.outputs.pdk_version }}
            gf180mcu-precheck.pdk_commit=${{ steps.pdk.outputs.pdk_commit }}

      # Refuse to build/publish an image whose promised labels did not all
      # resolve to non-empty values (e.g. a typo'd step output silently
      # expanding to ""). See the June 2026 PDK_TAG removal incident: images
      # were published without a resolvable PDK version for weeks.
      - name: Verify required image labels are resolved
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: python3 scripts/check_image_labels.py

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Only push to GHCR for branch/tag pushes on the main repo (not PRs, not forks)
          push: ${{ github.event_name != 'pull_request' && github.repository == 'wafer-space/gf180mcu-precheck' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: ${{ steps.gha_cache_permissions.outputs.can_write == 'true' && 'type=gha,mode=max' || '' }}
